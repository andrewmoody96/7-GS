# Checks main (production) and the dev branch on every push, plus every pull request,
# so a dev → main PR shows its result before it's merged.
name: CI

on:
  push:
    branches: [main, claude/7-game-series-brainstorm-8ydzpv]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The API tests run against real Postgres (as on Heroku), not just the in-memory PGlite:
    # some queries only fail on the real thing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r --if-present build
